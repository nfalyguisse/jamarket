<article
  class="group flex h-full flex-col overflow-hidden rounded-2xl border border-outline/10 bg-surface-container-lowest shadow-sm transition-shadow hover:shadow-md"
>
  <div class="relative aspect-[4/3] overflow-hidden">
    <img
      [src]="environment.cdnUrl + vehicle().imageUrl"
      [alt]="vehicle().imageAlt"
      class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105"
      loading="lazy"
      width="640"
      height="480"
    />
    <button
      type="button"
      class="absolute right-3 top-3 z-10 flex size-9 items-center justify-center rounded-full bg-white/90 text-on-surface-variant shadow-sm transition hover:bg-white hover:text-primary"
      [attr.aria-label]="'Ajouter ' + vehicle().title + ' aux favoris'"
      (click)="onFavoriteClick($event)"
    >
      <svg lucideHeart class="size-4" aria-hidden="true" />
    </button>
  </div>

  <div class="flex flex-1 flex-col justify-between p-5">
    <div class="min-h-0">
      <h3
        class="line-clamp-2 font-headline-md text-base font-bold text-on-background"
        [title]="vehicle().title"
      >
        {{ vehicle().title }}
      </h3>

      <p class="mt-1 text-xl font-bold text-primary">
        {{ vehicle().price | currency: 'EUR':'symbol':'1.0-0':'fr' }}
      </p>

      <ul class="mt-4 flex flex-wrap gap-x-4 gap-y-2 text-label-sm text-on-surface-variant">
        <li class="inline-flex items-center gap-1.5">
          <svg lucideGauge class="size-3.5 shrink-0" aria-hidden="true" />
          <span>{{ vehicle().mileageKm | number: '1.0-0':'fr' }} km</span>
        </li>
        <li class="inline-flex items-center gap-1.5">
          <svg lucideCalendar class="size-3.5 shrink-0" aria-hidden="true" />
          <span>{{ vehicle().year }}</span>
        </li>
        <li class="inline-flex items-center gap-1.5">
          <svg lucideFuel class="size-3.5 shrink-0" aria-hidden="true" />
          <span>{{ vehicle().fuelType ?? vehicle().transmission }}</span>
        </li>
      </ul>
    </div>

    <a
      [routerLink]="['/annonces', vehicle().id]"
      class="mt-5 inline-flex w-full shrink-0 items-center justify-center rounded-xl bg-primary py-3 text-label-md font-bold uppercase tracking-wide text-on-primary transition hover:opacity-90 active:scale-[0.99]"
    >
      Voir la fiche
    </a>
  </div>
</article>
